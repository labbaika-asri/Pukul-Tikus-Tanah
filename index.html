<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Whack a Mole</title>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div x-data="whackGame()" class="game">
            <h1>Whack a Mole</h1>
            <button type="button" class="mulai" @click="mulai()">Mulai!</button>
            <h2 class="papan-skor" x-text="skor">0</h2>
            <div class="container">
                <template x-for="(item, index) in tanah" :key="index">
                    <div
                        class="tanah"
                        :class="{muncul: item.muncul, hit: hitIndex === index}"
                    >
                        <span class="plus" x-show="hitIndex === index">+1</span>
                        <div class="tikus" @click="pukul(index)"></div>
                    </div>
                </template>
            </div>
            <audio src="audio/Pop.mp3" x-ref="pop"></audio>
            <h3>Waktu: <span x-text="waktu"></span></h3>
        </div>
        <script>
            const whackGame = () => ({
                tanah: Array.from({ length: 6 }, () => ({ muncul: false })), // Lobang tanah
                tanahSebelumnya: null,
                skor: 0,
                waktu: 10,
                timerInterval: null,
                hitIndex: null,
                // Mengacak tanah yang akan muncul tikus dan tidak boleh sama dengan sebelumnya
                randomTanah() {
                    let index;
                    do {
                        index = Math.floor(Math.random() * this.tanah.length);
                    } while (index === this.tanahSebelumnya);
                    this.tanahSebelumnya = index;
                    return index;
                },
                // Mengacak waktu kemunculan tikus
                randomWaktu(min, max) {
                    return Math.floor(Math.random() * (max - min + 1)) + min;
                },
                munculkanTikus() {
                    if (this.selesai) return;

                    const index = this.randomTanah(); // Cari tanah acak muncul tikus
                    this.tanah[index].muncul = true; // Munculkan tikus di tanah tersebut

                    const waktu = this.randomWaktu(300, 1000); // Waktu tikus muncul
                    // Setelah waktu habis, sembunyikan tikus dan panggil lagi fungsi munculkanTikus
                    setTimeout(() => {
                        this.tanah[index].muncul = false;
                        this.munculkanTikus();
                    }, waktu);
                },

                mulai() {
                    this.selesai = false;
                    this.skor = 0;
                    this.waktu = 10;

                    this.tanah.forEach((t) => (t.muncul = false));
                    this.munculkanTikus();
                    clearInterval(this.timerInterval);
                    this.timerInterval = setInterval(() => {
                        this.waktu--;
                        if (this.waktu <= 0) {
                            this.waktu = 0;
                            this.selesai = true;
                            clearInterval(this.timerInterval);
                        }
                    }, 1000);
                },

                pukul(index) {
                    if (!this.tanah[index].muncul) return;
                    this.$refs.pop.currentTime = 0;
                    this.$refs.pop.play();
                    this.tanah[index].muncul = false;
                    this.skor++;

                    // 💥 trigger efek visual
                    this.hitIndex = index;
                    setTimeout(() => {
                        this.hitIndex = null;
                    }, 150);
                },
            });
        </script>
    </body>
</html>
